{% extends 'base.html' %}

{% block title %}403 Forbidden - Trackwise{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h2 class="mb-0">403 — Access Denied</h2>
            </div>
            <div class="card-body">
                <p class="lead">You do not have permission to access this page.</p>
                <p class="text-muted">This action is restricted to staff/manager accounts.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
  <h2>Confirm Delete</h2>
  <p>Are you sure you want to delete this assignment for "{{ object.training.title }}" assigned to {{ object.trainee.username }}?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{% url 'assignment-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
